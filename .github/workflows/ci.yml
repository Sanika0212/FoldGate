name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint, types, tests without model weights
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --python 3.12 --all-extras
      - name: Lint
        run: |
          uv run ruff check src tests eval
          uv run ruff format --check src tests eval
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q --cov=foldgate --cov-report=term --cov-fail-under=68

  model:
    name: ESM-2, LoRA, ONNX export and parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --python 3.12 --all-extras
      - name: Cache the Hugging Face weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-esm2-35m-${{ hashFiles('src/foldgate/model.py') }}
          restore-keys: hf-esm2-35m-
      - name: Whole suite, including the tests that download ESM-2
        run: uv run pytest -q -m "" --cov=foldgate --cov-report=term --cov-fail-under=85

  terraform:
    name: terraform (aws)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform/aws
          framework: terraform
          soft_fail: true
          quiet: true

  manifests:
    name: kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the Helm chart
        run: helm template foldgate deploy/helm --values deploy/helm/values.yaml > /tmp/rendered.yaml
      - name: Validate the rendered manifests and the KServe one
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary /tmp/rendered.yaml
          ./kubeconform -strict -summary -ignore-missing-schemas deploy/kserve
