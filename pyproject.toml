[project]
name = "foldgate"
version = "0.1.0"
description = "Protein variant-effect models that know when not to be trusted, from training to serving"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sanika Najan", email = "sanikanajan@gmail.com" }]
dependencies = [
  "torch>=2.4",
  "transformers>=4.45",
  "peft>=0.13",
  "lightning>=2.4",
  "numpy>=1.26",
  "pandas>=2.2,<3",
  "pyarrow>=17",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "huggingface-hub>=0.25",
  "onnx>=1.16",
  "onnxruntime>=1.19",
  "mlflow>=2.16",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
monitoring = ["evidently>=0.4"]
triton = ["tritonclient[http]>=2.50"]

[project.scripts]
foldgate = "foldgate.cli:main"

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.3", "pytest-cov>=5.0", "pandas-stubs"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foldgate"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]
# Lightning is imported as L by convention, including in its own documentation.
ignore = ["N812"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/foldgate"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/test_data.py imports tests.conftest, which needs the repository root importable.
# "python -m pytest" puts it there and the pytest console script does not, so without this
# the suite passes locally one way and fails in CI, which runs "uv run pytest".
pythonpath = ["."]
markers = [
  "model: downloads ESM-2 from the Hugging Face Hub and runs it (slow)",
]
addopts = "-m 'not model'"

